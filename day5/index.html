<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Directory</title>
  <script src="users.js" defer></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2430;
      --muted: #5b6575;
      --accent: #1f5fbf;
      --border: #d5dae2;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181f;
        --card: #1d232d;
        --text: #e8ecf2;
        --muted: #9aa5b5;
        --accent: #6aa2f0;
        --border: #333c4a;
        --error: #f2827a;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    h1 { margin-top: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; margin-bottom: 1rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; min-width: 12rem; }
    label { font-weight: 600; }
    input, button {
      font: inherit;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #status { color: var(--muted); min-height: 1.5em; }
    #status.error { color: var(--error); font-weight: 600; }
    #users-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem; }
    #users-list li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    #users-list h2 { font-size: 1.1rem; margin: 0 0 0.25rem; }
    #users-list p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users" type="button">Load users</button>
    <div class="field">
      <label for="filter-input">Filter by name</label>
      <input id="filter-input" type="text" placeholder="Type a name" autocomplete="off">
    </div>
  </div>

  <p id="status" role="status" aria-live="polite"></p>
  <ul id="users-list"></ul>
</body>
</html>
